name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'build_v*'

permissions:
  contents: write

jobs:
  build-mobile:
    name: Build mobile app APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate signing keystore (mobile)
        run: |
          keytool -genkeypair -v \
            -keystore simple_live_app/android/app/key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelive -storepass android -keypass android \
            -dname "CN=SimpleLive,OU=Dev,O=SimpleLive,L=Unknown,S=Unknown,C=CN"
          printf 'storeFile=key.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=simplelive\n' \
            > simple_live_app/android/key.properties

      - name: Build mobile app
        run: |
          cd simple_live_app
          flutter pub get
          # Newer Flutter (3.38) no longer auto-applies the Kotlin Gradle plugin to
          # plugin modules. Plugins that ship .kt sources but omit
          # `apply plugin: 'kotlin-android'` (e.g. auto_orientation_v2) then fail to
          # compile their Kotlin, producing "cannot find symbol <PluginClass>" at app
          # compile time. Inject the plugin where it is missing.
          echo "== patching plugins missing the Kotlin Gradle plugin =="
          find "$HOME" -name "AutoOrientationPlugin.kt" 2>/dev/null | while read -r kt; do
            bg="$(dirname "$kt")/../../build.gradle"
            if [ -f "$bg" ] && ! grep -qiE "kotlin-android|org.jetbrains.kotlin.android" "$bg"; then
              sed -i "s/\(apply plugin:[ ]*['\"]com.android.library['\"]\)/\1\napply plugin: 'kotlin-android'/" "$bg"
              echo "patched: $bg"
            fi
          done
          # Fallback: scan the pub cache for any other plugin with the same problem.
          find "$HOME/.pub-cache" -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "com.android.library" "$f" && ! grep -qiE "kotlin-android|org.jetbrains.kotlin.android" "$f"; then
              if grep -rq "\.kt\$" "$(dirname "$f")/src" 2>/dev/null; then
                sed -i "s/\(apply plugin:[ ]*['\"]com.android.library['\"]\)/\1\napply plugin: 'kotlin-android'/" "$f"
                echo "patched (fallback): $f"
              fi
            fi
          done
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --release --split-per-abi

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk

  build-tv:
    name: Build TV app APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Generate signing keystore (TV)
        run: |
          keytool -genkeypair -v \
            -keystore simple_live_tv_app/android/app/key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias simplelivetv -storepass android -keypass android \
            -dname "CN=SimpleLiveTV,OU=Dev,O=SimpleLive,L=Unknown,S=Unknown,C=CN"
          printf 'storeFile=key.jks\nstorePassword=android\nkeyPassword=android\nkeyAlias=simplelivetv\n' \
            > simple_live_tv_app/android/key.properties

      - name: Build TV app
        run: |
          cd simple_live_tv_app
          flutter pub get
          # Same Kotlin-plugin injection as the mobile job (see above).
          echo "== patching plugins missing the Kotlin Gradle plugin =="
          find "$HOME" -name "AutoOrientationPlugin.kt" 2>/dev/null | while read -r kt; do
            bg="$(dirname "$kt")/../../build.gradle"
            if [ -f "$bg" ] && ! grep -qiE "kotlin-android|org.jetbrains.kotlin.android" "$bg"; then
              sed -i "s/\(apply plugin:[ ]*['\"]com.android.library['\"]\)/\1\napply plugin: 'kotlin-android'/" "$bg"
              echo "patched: $bg"
            fi
          done
          find "$HOME/.pub-cache" -path "*/android/build.gradle" 2>/dev/null | while read -r f; do
            if grep -q "com.android.library" "$f" && ! grep -qiE "kotlin-android|org.jetbrains.kotlin.android" "$f"; then
              if grep -rq "\.kt\$" "$(dirname "$f")/src" 2>/dev/null; then
                sed -i "s/\(apply plugin:[ ]*['\"]com.android.library['\"]\)/\1\napply plugin: 'kotlin-android'/" "$f"
                echo "patched (fallback): $f"
              fi
            fi
          done
          flutter build apk --release --split-per-abi

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*.apk

  release:
    name: Publish release (on tag)
    needs: [build-mobile, build-tv]
    if: startsWith(github.ref, 'refs/tags/build_v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: apks/**/*.apk
