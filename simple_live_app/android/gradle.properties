org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Relax strict JVM-target validation: some Flutter plugin modules pair a
# Java target (1.8) with the Kotlin plugin's default target (17). The
# build.gradle.kts already aligns each module's Kotlin target to its Java
# target; this is a safety net so any residual mismatch only warns.
kotlin.jvm.target.validation.mode=warning
